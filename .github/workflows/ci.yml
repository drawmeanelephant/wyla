name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.env', 'scripts/install-tools.sh') }}

      - name: Cache npm (jscpd)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install tools
        run: make bootstrap

      - name: Format
        run: make format-check

      - name: Lint
        run: make lint

      - name: Test core with coverage
        run: make coverage

      - name: Duplicate code
        run: make duplicates

      - name: Build and analyze
        run: make analyze

      - name: Build timing summary
        if: always()
        run: |
          if [ -f build/xcodebuild-analyze.log ]; then
            { echo '### Build timing'; echo '```'; scripts/build-timing.sh build/xcodebuild-analyze.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Integration tests
        run: make integration-test

      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            build/test-results/
            build/*.log
          if-no-files-found: ignore
          retention-days: 14
